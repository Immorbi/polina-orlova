<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>polinaorlova</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400;1,6..96,700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #1e2b3c;
      --paper: #ffffff;
      --dim:   rgba(30,43,60,.66);
      --rule:  rgba(30,43,60,.12);
      --mono:  'EB Garamond', Georgia, serif;
      --serif: 'EB Garamond', Georgia, serif;
      --disp:  'Bodoni Moda', Georgia, serif;
      --sans:  'Helvetica Neue', Helvetica, Arial, sans-serif;
      --nav:   52px;
    }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* grain */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 999; pointer-events: none;
      opacity: .018;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='512' height='512' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    /* floating next-work pill */
    .next-pill {
      position: fixed;
      bottom: 60px;
      right: 60px;
      z-index: 200;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      text-decoration: none;
      mix-blend-mode: difference;
      opacity: 1;
      transition: opacity .4s ease;
      pointer-events: auto;
    }
    .next-pill.hidden { opacity: 0; pointer-events: none; }
    .next-pill-text {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .next-pill-label {
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #fff;
    }
    .next-pill-title {
      font-family: var(--disp);
      font-weight: 400;
      font-style: italic;
      font-size: 15px;
      color: #fff;
      line-height: 1.1;
      max-width: 180px;
      text-align: right;
    }
    .next-pill-arrow {
      color: #fff;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      /* compact, thumb-sized button in the bottom-right corner */
      .next-pill {
        bottom: max(16px, env(safe-area-inset-bottom));
        right: 16px;
        padding: 12px 14px;
        gap: 10px;
        mix-blend-mode: normal;
        background: rgba(13,17,23,.72);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border-radius: 999px;
        align-items: center;
      }
      .next-pill-title { font-size: 14px; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .next-pill-label { font-size: 8px; }
      .next-pill-arrow { width: 18px; height: 18px; }
    }

    /* ── nav ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      z-index: 100;
    }
    .nav-back {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: color .4s ease, opacity .25s;
    }
    @media (hover: hover) { .nav-back:hover { opacity: .6; } }
    .nav-back svg { width: 14px; }
    .nav-name {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      transition: color .4s ease;
    }
    .nav { transition: background-color .3s ease, border-color .3s ease; border-bottom: 1px solid transparent; }
    .nav--scrolled { background: var(--paper); border-bottom-color: var(--rule); }
    .nav--scrolled .nav-back,
    .nav--scrolled .nav-name { color: var(--ink); }
    .nav-logo {
      width: 18px;
      height: 18px;
      fill: currentColor;
      display: block;
      flex-shrink: 0;
    }

    /* ── hero ── */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;   /* visible area on phones, excluding browser bars */
      overflow: hidden;
      background: #0d1117;
    }

    .hero-media {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: .88;
    }

    /* static image fallback */
    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: .88;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(13,17,23,.2) 0%,
        rgba(13,17,23,.1) 40%,
        rgba(13,17,23,.55) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 60px;
      left: 60px;
      right: 60px;
    }

    .hero-title {
      font-family: var(--disp);
      font-weight: 400;
      font-style: italic;
      font-size: clamp(36px, 5vw, 72px);
      color: #fff;
      line-height: 1.05;
      letter-spacing: -.01em;
      opacity: 0;
      animation: fadeUp .9s cubic-bezier(.16,1,.3,1) .4s forwards;
    }

    .hero-medium {
      margin-top: 12px;
      font-family: var(--sans); font-size: 13px; letter-spacing: .02em; line-height: 1.3;
      color: rgba(255,255,255,.72);
      opacity: 0; animation: fadeUp .7s ease .6s forwards;
    }
    .hero-medium:empty { display: none; }
    .hero-meta {
      font-family: var(--sans);
      font-weight: 400;
      font-size: 12px;
      letter-spacing: .02em;
      color: rgba(255,255,255,.6);
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 24px;
      line-height: 1.15;
      opacity: 0;
      animation: fadeUp .7s ease .2s forwards;
    }


    /* ── gallery ── */
    .gallery-section {
      padding: 80px 60px;
      max-width: 900px;
      margin: 0 auto;
    }

    .gallery-header { display: none; }

    /* ── work text (from the portfolio) ── */
    .work-info { margin: 0 0 72px; max-width: 680px; }
    .work-info[hidden] { display: none; }
    .work-medium {
      font-family: var(--sans); font-size: 12px; letter-spacing: .02em; line-height: 1.5;
      color: var(--dim);
    }
    .work-part { margin: 0 0 32px; max-width: 680px; }
    .work-part--next { margin-top: 112px; padding-top: 48px; border-top: 1px solid var(--rule); max-width: none; }
    .work-part--next > * { max-width: 680px; }
    .work-part-title { font-family: var(--disp); font-weight: 400; font-style: italic; font-size: clamp(28px, 3vw, 40px); line-height: 1.1; letter-spacing: -.01em; }
    .work-part-meta { margin-top: 10px; font-family: var(--sans); font-size: 12px; letter-spacing: .02em; line-height: 1.5; color: var(--dim); display: flex; flex-wrap: wrap; gap: 2px 20px; }
    .work-part .work-text { margin-top: 22px; }
    .gallery-grid:empty { display: none; }
    .gallery-grid:empty + .work-part--next { margin-top: 56px; }
    .work-part:has(+ .gallery-grid:empty) { margin-bottom: 0; }
    @media (max-width: 540px) { .gallery-grid:empty + .work-part--next { margin-top: 36px; padding-top: 28px; } .work-part-meta { flex-direction: row !important; gap: 0 14px !important; } }
    @media (max-width: 540px) {
      .work-part { margin: 12px 20px 24px; }
      .work-part--next { margin: 36px 0 20px; padding: 32px 20px 0; }
      .work-part-meta { flex-direction: column; gap: 1px; }
    }
    .work-medium:empty { display: none; }
    .work-medium:empty + .work-text { margin-top: 0; }
    .work-medium span { display: block; }
    .work-medium span + span { margin-top: 2px; }
    .work-medium .wm-label { color: var(--ink); }
    .work-text { margin-top: 28px; font-family: var(--serif); font-size: clamp(17px, 1.5vw, 19px); line-height: 1.6; color: var(--ink); }
    .work-text p + p { margin-top: 1em; }
    .work-text p { text-wrap: pretty; }
    @media (max-width: 540px) {
      .work-info { margin: 12px 20px 40px; }
      .work-text { margin-top: 20px; font-size: 16.5px; line-height: 1.55; }
    }

    .gallery-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .gallery-count {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .14em;
      color: var(--dim);
    }

    .gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* rows: one full-width photo, or a pair scaled to the same height */
    .gallery-row {
      display: flex;
      gap: 3px;
    }

    .gallery-item {
      cursor: pointer;
      overflow: hidden;
      background: #f0ede8;
      flex: 1 1 0;
      min-width: 0;
    }

    .gallery-row--solo-portrait .gallery-item {
      flex: 0 1 auto !important;
      width: 66%;
      margin: 0 auto;
    }

    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .8s cubic-bezier(.16,1,.3,1), opacity .3s;
    }

    @media (hover: hover) { .gallery-item:hover img { transform: scale(1.03); } }

    /* ── lightbox ── */
    .lb {
      position: fixed; inset: 0; z-index: 500;
      background: #0d1117;
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none;
      transition: opacity .25s cubic-bezier(.23,1,.32,1);
    }
    .lb.lb--open { opacity: 1; pointer-events: all; }
    /* iOS Safari: cover the area behind the browser bars too, keep content in the visible part */
    @supports (height: 100lvh) {
      .lb {
        inset: auto;
        top: 0; left: 0; right: 0;
        height: 100lvh;
        padding-bottom: calc(100lvh - 100svh);
      }
    }
    html.lb-lock, html.lb-lock body { background: #0d1117; }

    /* mobile: "next work" end slide after the last photo */
    .lb-end {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; width: 100%; max-width: 360px;
      color: #fff;
      animation: fadeUp .45s ease both;
    }
    .lb-end[hidden] { display: none; }
    .lb-end-label {
      font-family: var(--sans); font-size: 10px; letter-spacing: .18em;
      text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 18px;
    }
    .lb-end-cover { display: block; width: 78%; aspect-ratio: 4/5; overflow: hidden; background: #1a2029; }
    .lb-end-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lb-end-title {
      font-family: var(--disp); font-style: italic; font-size: 28px; line-height: 1.1;
      margin: 20px 0 22px;
    }
    .lb-end-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 24px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.35);
      color: #fff; text-decoration: none;
      font-family: var(--sans); font-size: 13px; letter-spacing: .02em;
    }
    .lb-end-btn:active { background: rgba(255,255,255,.1); }
    .lb-end-hint {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 22px; font-family: var(--sans); font-size: 11px;
      color: rgba(255,255,255,.35);
    }
    @media (max-width: 768px) { .lb-nw { display: none !important; } }

    .lb-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 32px; flex-shrink: 0;
    }
    .lb-title {
      font-family: var(--mono); font-size: 9px; font-weight: 500;
      letter-spacing: .22em; text-transform: uppercase;
      color: rgba(255,255,255,.45);
    }
    .lb-meta { display: flex; align-items: center; gap: 24px; }
    .lb-counter { font-variant-numeric: tabular-nums; }
    .lb-counter {
      font-family: var(--mono); font-size: 9px; font-weight: 500;
      letter-spacing: .18em; color: rgba(255,255,255,.3);
    }
    .lb-close {
      font-family: var(--mono); font-size: 9px; font-weight: 500;
      letter-spacing: .2em; text-transform: uppercase;
      color: rgba(255,255,255,.45); background: none; border: none;
      cursor: pointer; transition: color .2s; padding: 15px; margin: -15px;
    }
    @media (hover: hover) { .lb-close:hover { color: #fff; } }

    .lb-stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; padding: 0 72px; min-height: 0;
    }
    .lb-img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      display: block; opacity: 0; transition: opacity .22s;
      user-select: none;
    }
    .lb-img.lb-img--in { opacity: 1; }
    .lb-img[hidden] { display: none; }

    .lb-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      padding: 16px 20px; color: rgba(255,255,255,.35);
      transition: color .2s; display: flex; align-items: center;
    }
    @media (hover: hover) { .lb-btn:hover { color: rgba(255,255,255,.9); } }
    .lb-btn--prev { left: 0; }
    .lb-btn--next { right: 0; }
    .lb-btn svg { width: 20px; height: 20px; }
    .lb-btn[hidden] { display: none; }
    .lb-footer { height: 32px; flex-shrink: 0; }

    /* lightbox next-work panel (shown at last photo) */
    .lb-nw {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 24px;
      text-decoration: none;
      color: rgba(255,255,255,.35);
      transition: color .2s;
    }
    @media (hover: hover) { .lb-nw:hover { color: rgba(255,255,255,.85); } }
    .lb-nw[hidden] { display: none; }
    .lb-nw-text { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .lb-nw-label {
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .lb-nw-title {
      font-family: var(--disp);
      font-weight: 400;
      font-style: italic;
      font-size: 14px;
      line-height: 1.2;
      max-width: 130px;
      text-align: right;
    }

    /* ── footer ── */
    .work-footer {
      border-top: 1px solid var(--rule);
      padding: 28px 60px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .work-footer-name {
      font-family: var(--mono);
      font-size: 8px; font-weight: 500;
      letter-spacing: .26em; text-transform: uppercase;
      color: var(--dim);
    }
    .work-footer-back {
      font-family: var(--mono);
      font-size: 8px; font-weight: 500;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--dim); text-decoration: none;
      transition: color .25s;
    }
    @media (hover: hover) { .work-footer-back:hover { color: var(--ink); } }

    /* ── light hero variant ── */
    .hero--light .hero-overlay {
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.6) 0%,
        rgba(0,0,0,.18) 35%,
        rgba(13,17,23,.55) 100%
      );
    }
    .nav--solid { mix-blend-mode: normal; }

    /* ── next work ── */
    .next-work {
      border-top: 1px solid var(--rule);
      max-width: 1200px;
      margin: 0 auto;
    }
    .next-work-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 48px 60px;
      text-decoration: none;
      color: var(--ink);
      gap: 24px;
      transition: opacity .25s;
    }
    @media (hover: hover) { .next-work-link:hover { opacity: .6; } }
    .next-work-left { display: flex; flex-direction: column; gap: 8px; }
    .next-work-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .next-work-title {
      font-family: var(--disp);
      font-weight: 400;
      font-style: italic;
      font-size: clamp(22px, 3vw, 36px);
      line-height: 1.1;
    }
    .next-work-arrow {
      flex-shrink: 0;
      color: var(--dim);
    }
    @media (max-width: 860px) { .next-work-link { padding: 40px 28px; } }
    @media (max-width: 540px) {
      .next-work-link { padding: 32px 20px calc(32px + env(safe-area-inset-bottom)); }
    }

    /* ── animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      .nav { padding: 0 28px; }
      .hero-content { left: 28px; right: 28px; bottom: 48px; }
      .gallery-section { padding: 56px 28px; }
      .work-footer { padding: 24px 28px; }
      .lb-stage { padding: 0 48px; }
    }
    @media (max-width: 540px) {
      .nav { padding: 0 20px; }
      .hero-content { left: 20px; right: 20px; bottom: 36px; }
      .hero-title { font-size: clamp(28px, 8vw, 44px); margin-bottom: 10px; }
      .hero-medium { margin-top: -2px; font-size: 12px; }
      .hero-meta { flex-direction: column; gap: 1px; font-size: 11px; line-height: 1.15; margin-bottom: 14px; }
      .hero-meta span:first-child { margin-bottom: 4px; }

      /* Gallery horizontal filmstrip */
      .gallery-section {
        padding: 20px 0 48px;
      }
      .gallery-header {
        display: none;
      }
      .gallery-grid {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 0 3px;
        scroll-padding-left: 20px;
        padding: 0 20px 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .gallery-grid::-webkit-scrollbar { display: none; }
      .gallery-row { display: contents; }
      /* filmstrip: every photo the same height, width follows its proportions */
      .gallery-grid { align-items: center; }
      .gallery-row--solo-portrait .gallery-item,
      .gallery-item {
        flex: 0 0 auto !important;
        width: calc(50vw * var(--r, 1));
        margin: 0;
        scroll-snap-align: start;
        overflow: hidden;
        background: #f0ede8;
      }
      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .lb-stage { padding: 0 28px; }
      .lb-header { padding: 14px 20px; }
      .work-footer {
        border-top: none;
        padding: 24px 20px;
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
    }

    /* ── back to top ── */
    .to-top {
      position: fixed;
      right: 40px;
      bottom: 40px;
      z-index: 210;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.82);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--ink);
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .35s ease, transform .35s ease, background-color .25s;
    }
    .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
    @media (hover: hover) { .to-top:hover { background: #fff; } }
    .to-top svg { width: 14px; height: 14px; }
    @media (max-width: 768px) {
      .to-top { right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 40px; height: 40px; }
    }

    /* on work pages sit above the Next Work pill */
    @media (min-width: 769px) { .to-top { right: 60px; bottom: 118px; } }
    @media (max-width: 768px) { .to-top { bottom: calc(78px + env(safe-area-inset-bottom)); } }

    /* ── hero "watch with sound" button ── */
    .hero-play {
      position: absolute;
      left: 60px; bottom: 60px;
      display: none;
      align-items: center; gap: 10px;
      height: 44px; padding: 0 18px;
      border: 1px solid rgba(255,255,255,.5); border-radius: 999px;
      background: rgba(0,0,0,.28);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      color: #fff; cursor: pointer;
      font-family: var(--sans); font-size: 13px; letter-spacing: .02em;
      opacity: 0; animation: fadeUp .7s ease .6s forwards;
      transition-property: background-color, border-color, transform; transition-duration: .25s;
    }
    @media (hover: hover) { .hero-play:hover { background: rgba(0,0,0,.45); border-color: #fff; } }
    .hero-play:active { transform: scale(.96); }
    .hero--video .hero-content { bottom: 128px; }
    .hero--video .hero-play { display: flex; }
    .hero-play-icon { display: flex; align-items: center; }
    .hero-play-icon svg { width: 17px; height: 17px; opacity: .8; }
    .hero-play .ico-lead { width: 14px; height: 14px; }
    .hero-play .ico-play { display: none; }
    .hero-play .lbl-m { display: none; }
    .hero--silent .hero-play-icon { display: none; }
    @media (max-width: 768px) {
      /* phone: a labelled pill under the title — "▶ Watch video 🔈" */
      .hero-play { left: 20px; bottom: calc(64px + env(safe-area-inset-bottom)); }
      .hero--video .hero-content { bottom: calc(128px + env(safe-area-inset-bottom)); right: 20px; }
    }

    /* ── scroll-down hint (centre of hero) ── */
    .scroll-hint {
      position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
      width: 44px; height: 44px; margin-left: -22px; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      background: none; border: 0; padding: 0; cursor: pointer;
      color: rgba(255,255,255,.8);
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.35));
      opacity: 0; animation: hintIn .8s ease 1s forwards;
      transition: color .25s;
    }
    .scroll-hint svg { width: 14px; height: 22px; animation: hintBob 2.4s cubic-bezier(.45,0,.55,1) 1.8s infinite; }
    .scroll-hint.gone { opacity: 0 !important; pointer-events: none; transition: opacity .3s ease; animation: none; }
    @media (hover: hover) { .scroll-hint:hover { color: #fff; } }
    @keyframes hintIn { to { opacity: 1; } }
    @keyframes hintBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { .scroll-hint svg { animation: none; } }
    @media (max-width: 768px) { .scroll-hint { display: none; } }

    /* ── hero video loading bar ── */
    .hero-loading {
      position: absolute; left: 0; right: 0; top: 0; height: 2px;
      background: rgba(255,255,255,.12); z-index: 150; overflow: hidden;
      transition: opacity .5s ease .2s;
    }
    .hero-loading span {
      display: block; height: 100%; width: 0; background: rgba(255,255,255,.85);
      transition: width .3s ease-out;
    }
    .hero-loading.done { opacity: 0; }
    /* before the size is known: a short segment sweeps across */
    .hero-loading.wait span { width: 28% !important; animation: heroLoadSweep 1.3s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes heroLoadSweep { from { transform: translateX(-100%); } to { transform: translateX(360%); } }

    /* ── video player overlay ── */
    .vp {
      position: fixed; inset: 0; z-index: 600;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s cubic-bezier(.23,1,.32,1);
    }
    @supports (height: 100lvh) {
      .vp { inset: auto; top: 0; left: 0; right: 0; height: 100lvh; padding-bottom: calc(100lvh - 100svh); }
    }
    .vp.vp--open { opacity: 1; pointer-events: all; }
    .vp video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .vp-bar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: flex-end; gap: 10px;
      padding: max(18px, env(safe-area-inset-top)) 24px 18px;
    }
    .vp-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background-color .25s, border-color .25s;
    }
    @media (hover: hover) { .vp-btn:hover { background: rgba(255,255,255,.12); border-color: #fff; } }
    .vp-btn svg { width: 18px; height: 18px; }
    .vp--silent #vpSound { display: none; }

    /* bottom control bar: play/pause · time · seek · duration · sound */
    .vp-controls {
      position: absolute; left: 0; right: 0;
      bottom: calc(100lvh - 100svh);
      display: flex; align-items: center; gap: 6px;
      padding: 28px 16px max(14px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
      color: #fff;
    }
    @supports not (height: 100lvh) { .vp-controls { bottom: 0; } }
    .vp-ctl {
      flex: none; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: 50%; color: #fff; cursor: pointer;
      transition-property: background-color, transform; transition-duration: .2s;
    }
    @media (hover: hover) { .vp-ctl:hover { background: rgba(255,255,255,.12); } }
    .vp-ctl:active { transform: scale(.92); }
    .vp-ctl svg { width: 18px; height: 18px; }
    #vpPlay .ico-pause, .vp--paused #vpPlay .ico-play { display: block; }
    #vpPlay .ico-play, .vp--paused #vpPlay .ico-pause { display: none; }
    #vpPlay .ico-play { margin-left: 2px; }
    #vpSound .ico-muted { display: none; }
    .vp--muted #vpSound .ico-muted { display: block; }
    .vp--muted #vpSound .ico-unmuted { display: none; }
    .vp-time {
      flex: none; min-width: 34px; text-align: center;
      font-family: var(--sans); font-size: 11px; letter-spacing: .02em;
      font-variant-numeric: tabular-nums; color: rgba(255,255,255,.8);
    }
    .vp-seek {
      position: relative; flex: 1; height: 44px; cursor: pointer;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .vp-track {
      position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
      background: rgba(255,255,255,.22); border-radius: 2px; overflow: hidden;
      transition: height .15s ease, margin-top .15s ease;
    }
    .vp-buffered, .vp-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
    .vp-buffered { background: rgba(255,255,255,.28); }
    .vp-fill { background: #fff; }
    .vp-thumb {
      position: absolute; top: 50%; left: 0; width: 12px; height: 12px;
      margin: -6px 0 0 -6px; border-radius: 50%; background: #fff;
      transform: scale(.0); transition: transform .15s ease;
      pointer-events: none;
    }
    .vp-seek:hover .vp-thumb, .vp--seeking .vp-thumb, .vp--paused .vp-thumb { transform: scale(1); }
    .vp-controls { padding-left: 20px; }
    .vp--seeking .vp-track, .vp-seek:hover .vp-track { height: 4px; margin-top: -2px; }
    .vp-seek:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }

    /* controls fade out while playing; tap / mouse move brings them back */
    .vp-bar, .vp-controls { transition: opacity .3s ease; }
    .vp--idle .vp-bar, .vp--idle .vp-controls { opacity: 0; pointer-events: none; }
    .vp--idle { cursor: none; }
    .vp-paused-icon {
      position: absolute; left: 50%; top: 50%;
      width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.3);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      color: #fff; display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transform: scale(.9);
      transition: opacity .2s ease, transform .2s ease;
    }
    .vp-paused-icon svg { width: 24px; height: 24px; margin-left: 3px; }
    .vp-paused-icon, #vpPlay { display: none; }  /* no play / pause icons: tap the picture to pause */
    @media (max-width: 540px) { .vp-controls { padding-left: 8px; padding-right: 8px; gap: 2px; } }

    .gallery-item:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    /* video tile in the gallery */
    .gallery-item--video { position: relative; background: #111; }
    .gallery-item--video video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-play {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 64px; height: 64px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.6);
      background: rgba(0,0,0,.25);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition-property: background-color, transform; transition-duration: .25s;
    }
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-overlay-play-button { display: none !important; -webkit-appearance: none; }
    .gallery-item--video { cursor: pointer; }
    .gallery-play svg { width: 22px; height: 22px; margin-left: 3px; }
    @media (hover: hover) { .gallery-item--video:hover .gallery-play { background: rgba(0,0,0,.4); } }
    .gallery-item--video:active .gallery-play { transform: translate(-50%, -50%) scale(.94); }
    @media (max-width: 540px) { .gallery-play { width: 48px; height: 48px; } .gallery-play svg { width: 18px; height: 18px; } }
    @media (max-width: 768px) { .vp-bar { padding-left: 16px; padding-right: 16px; } }

    /* ── polish (design-engineering pass) ── */
    ::selection { background: rgba(30,43,60,.88); color: #fff; }
    a:focus-visible, button:focus-visible {
      outline: 1px solid currentColor; outline-offset: 4px; border-radius: 2px;
    }
    /* invisible 44px hit areas for small text links */
    .nav-back, .nav-name { position: relative; }
    .nav-back::before, .nav-name::before {
      content: ''; position: absolute; left: -10px; right: -10px; top: 50%;
      height: 44px; transform: translateY(-50%);
    }
    /* press feedback */
    .to-top, .vp-btn, .hero-play-icon, .lb-end-btn, .footer-icon { transition-property: background-color, border-color, color, opacity, transform; }
    .to-top:active, .vp-btn:active, .hero-play:active .hero-play-icon, .lb-end-btn:active, .footer-icon:active { transform: scale(.94); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; scroll-behavior: auto !important; }
      .panel-grid { transform: none !important; }
      .work-card:hover .work-card-img img, .gallery-item:hover img { transform: none !important; }
    }
  </style>
</head>

        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="3" y1="10" x2="17" y2="10"/><polyline points="12,5 17,10 12,15"/></svg>
      </a>
      <span class="lb-end-hint">
        <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="17" y1="10" x2="3" y2="10"/><polyline points="8,5 3,10 8,15"/></svg>
        swipe back to photos
      </span>
    </div>
    <a class="lb-nw" id="lbNw" href="#" hidden>
      <div class="lb-nw-text">
        <span class="lb-nw-label">Next Work</span>
        <span class="lb-nw-title" id="lbNwTitle"></span>
      </div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2">
        <line x1="4" y1="10" x2="16" y2="10"/>
        <polyline points="11,5 16,10 11,15"/>
      </svg>
    </a>
  </div>
  <div class="lb-footer"></div>
</div>

<script>
  const WORKS = {
    'depth-of-the-inner-voice': { title: 'Depth of the Inner Voice', year: '2020 / 2025', count: 23, video: true, credits: 'Photo & Video: Roma Renton',
      // the same mirror work, shown twice in two different forms
      parts: [
        { id: 'voice', title: 'Depth of the Inner Voice', meta: ['2025', 'Mirrors, hand engraving, chromed steel'], text: 'depth-of-the-inner-voice', folder: 'depth-of-the-inner-voice', count: 23 },
        { id: 'world', title: 'Depth of the Inner World', meta: ['2020', 'Mirrors, sandblasting, chromed steel', 'Photo: Roma Renton'], text: 'depth-of-the-inner-world', folder: 'depth-of-the-inner-world', count: 10 },
      ] },
    'quiet':                    { title: 'Quiet Damage',              year: '2026', count: 6,  video: false },
    'under-the-skin-of-the-garden': { title: 'Under the Skin of a Garden', year: '2025', count: 5, video: false },
    'choir':                    { title: 'Choir',                     year: '2025', count: 6,  video: false },
    'chamber-of-memory':        { title: 'Chamber of Memory',         year: '2025', count: 1,  video: false, lightHero: true },
    'shape-of-a-human':         { title: 'Shape of a Human',          year: '2022', count: 19, video: true, sound: true, clips: 5,  credits: 'Video: Merry Manyface · Photo: Liza New Fire, Daria Vengerskaya' },
    'system':                   { title: 'Reference System', year: '2019–2025', count: 22, video: true, credits: 'Photo & Video: Roma Renton',
      // one drip system, shown at different exhibitions — photos grouped by show, newest first
      parts: [
        { id: 'v4', title: 'New Locality',                  meta: ['Version 4', 'The Gallery, Tbilisi', '2025'],      folder: 'system', photos: [17,18,19,20,21,22] },
        { id: 'v2', title: 'Salt Room',                     meta: ['Version 2', 'Sisters Room Space, Tbilisi', '2024'], folder: 'system', photos: [1,2,3,4,5,6,7,8,9] },
        { id: 'v1', title: 'Ordinary Things',               meta: ['Version 1', 'DK Gromov, St. Petersburg', '2019'], folder: 'system', photos: [10,11,12,13,14,15,16] },
      ] },
  };

  // Get slug from URL
  // old links: Depth of the Inner World now lives as the second part of Depth of the Inner Voice
  const ALIASES = { 'depth-of-the-inner-world': ['depth-of-the-inner-voice', 'world'] };
  let slug = new URLSearchParams(location.search).get('s') || 'depth-of-the-inner-voice';
  let jumpToPart = location.hash.slice(1) || null;
  if (ALIASES[slug]) { [slug, jumpToPart] = ALIASES[slug]; history.replaceState(null, '', `work.html?s=${slug}#${jumpToPart}`); }
  const work = WORKS[slug] || WORKS['depth-of-the-inner-voice'];


  // Light hero variant
  if (work.lightHero) {
    document.getElementById('hero').classList.add('hero--light');
    document.querySelector('.nav').classList.add('nav--solid');
  }

  // Next work
  const WORK_SLUGS = Object.keys(WORKS);
  const currentIdx = WORK_SLUGS.indexOf(slug);
  const nextSlug = WORK_SLUGS[(currentIdx + 1) % WORK_SLUGS.length];
  const nextWork = WORKS[nextSlug];
  document.getElementById('nextWorkTitle').textContent = nextWork.title;
  document.getElementById('nextWorkLink').href = `work.html?s=${nextSlug}`;
  document.getElementById('nextPillTitle').textContent = nextWork.title;
  document.getElementById('nextPill').href = `work.html?s=${nextSlug}`;
  document.getElementById('lbNwTitle').textContent = nextWork.title;
  document.getElementById('lbNw').href = `work.html?s=${nextSlug}`;

  // no hanging prepositions / short words at line ends; keep a dash with the word before it
  const SHORT = /(?<=^|[\s\u00a0(“"])(a|an|the|of|in|on|at|to|by|as|is|it|or|and|but|for|nor|so|yet|if|be|we|i|do|my|no|up|its|via|with|from|into|over|than|that|this|was|are|has|had|not|all|can|one|two|her|his|our|out|who|how|may|new|old|each|like|both|through) /gi;
  const tidy = t => t.replace(SHORT, '$1\u00a0').replace(/ —/g, '\u00a0—');

  // Work texts — from Polina's portfolio (POLINA_ORLOVA2026.pdf)
  const TEXTS = {
    'depth-of-the-inner-voice': {
      medium: 'Mirrors, hand engraving, chromed steel',
      text: [
        'Depth of the Inner Voice explores reflection as a boundary between the internal and the external. The cosmetic mirror is used not as a functional object, but as a symbol of a standardized, mass-produced form. Engraved masks on each mirror represent inner thoughts. Though these images exist on the surface, they belong to the individual’s inner space.',
        'Light interacts with the engravings, casting projections that shift with the angle of the beam. The mirror becomes a tool for self-reflection, allowing the viewer to encounter not the exterior, but states of consciousness.'
      ]
    },
    'quiet': {
      medium: 'Fabric, candle soot, light setup',
      places: ['Helikon Art Residency, Kocaeli, Turkey'],
      text: [
        'Quiet Damage is about memory and marks that stay with us. I think of fabric as something similar to skin. Like our skin, it keeps the marks of what we experience, both inside and outside. The soot, burn marks, and small holes show these traces.',
        'I am interested not in the moment of damage, but in what comes after. Like the human body, the fabric continues to exist, carrying the memory of what has changed it.'
      ]
    },
    'under-the-skin-of-the-garden': {
      medium: 'Threads, garden, light setup',
      places: ['Castello Art Residency, Umbria, Italy'],
      text: [
        'It consists of threads stretched between the branches of an olive tree and the ground, symbolizing flows of energy. They remind me of vertical lines of rain or rays of sunlight.',
        'This installation serves as a metaphor for hidden codes, fleeting moments, and the fragile boundaries of our interaction with the world.'
      ]
    },
    'choir': {
      medium: 'Threads, nails, spray paint',
      places: ['Rubezh exhibition'],
      text: [
        'A choir is many voices breathing as one. Each voice stays separate, like threads crossing an image. This work is based on the image of a group of people singing — a repeating pattern of open mouths is spray-painted onto a curtain of thin threads.',
        'The lines create the surface where the image appears through breaking the form itself. Each of us is a fragile thread, yet together we form a fabric that holds sound. People sing through boundaries, through lines that block and connect.'
      ]
    },
    'chamber-of-memory': {
      medium: 'Threads, spray paint',
      places: ['The Gallery, exhibition “In Good Hands”, Tbilisi'],
      text: [
        'The installation Chamber of Memory explores themes of personal boundaries, memory, and the passage of time. Unfolding in a small, enclosed space, it becomes a visual metaphor for the inner world — intimate, hidden from outside view.',
        'A dense curtain of black threads stretches from ceiling to floor, creating both a physical and visual barrier between the viewer and the depth of the room. Abstract stains appear on the threads, resembling blurred fragments of memories — images that surface, fade, and return again.'
      ]
    },
    'shape-of-a-human': {
      medium: 'Gypsum gold-plated frames, textile mesh, threads',
      text: [
        'In this project, I imagine a future in which human existence evolves through transformation. I explore progress and achievement across different fields as expressed through changes in the body.',
        'I envision a human form capable of adapting through cognition — reshaping itself in response to need. In this way, the body becomes a universal, self-designed structure, enabling continuous growth, new achievements, and ongoing transformation.'
      ]
    },
    'depth-of-the-inner-world': {
      medium: 'Mirrors, sandblasting, chromed steel',
      text: [
        'The sculptures are based on mirrors featuring a cosmetic mask as a standardized symbol. The imagery is created through sandblasting, producing a texture that echoes the surface of the mask.',
        'As viewers look into each sculpture, they see themselves through a barrier — one that reflects superficial perception. Yet, by looking more closely, deeper layers begin to emerge.'
      ]
    },
    'system': {
      medium: 'Fabric, drip system, liquid dyes',
      placesLabel: 'Shown',
      places: [
        'Version 4 — The Gallery, “New Locality”, 2025',
        'Version 3 — DDD Kunst House, “Tomorrow Has Already Happened”, 2025',
        'Version 2 — Sisters Room Space, “Salt Room”, 2024',
        'Version 1 — DK Gromov, “Ordinary Things”, 2019'
      ],
      text: [
        'A fabric-dyeing system in constant transformation gradually forms an abstract panel as the pigments in its drip mechanisms are exhausted. The installation materializes the passage of time, turning an ephemeral process into a tangible record.',
        'Initiated by the artist yet beyond their control, droplets fall, interact with the surface, and leave traces — marks of chance, pauses, and density. This evolving process cannot be stopped or repeated, existing as a testimony to time itself.',
        'The work invites viewers to witness an image in flux, shifting focus from the final outcome to the unrepeatable journey.'
      ]
    }
  };
  const info = work.parts ? (work.parts[0].text ? null : TEXTS[slug]) : TEXTS[slug];
  if (info) {
    const med = document.getElementById('workMedium');
    const add = (t, cls) => { const sp = document.createElement('span'); sp.textContent = t; if (cls) sp.className = cls; med.appendChild(sp); };
    document.getElementById('heroMedium').textContent = info.medium;
    if (info.places && info.places.length && !work.parts) {
      if (info.placesLabel) add(info.placesLabel, 'wm-label');
      info.places.forEach(t => add(t));
    }
    const box = document.getElementById('workText');
    info.text.forEach(t => { const pp = document.createElement('p'); pp.textContent = tidy(t); box.appendChild(pp); });
    document.getElementById('workInfo').hidden = false;
  }

  // Hero
  document.getElementById('heroTitle').textContent = work.title;
  const metaParts = [work.year];
  if (work.credits) metaParts.push(...work.credits.split(' · '));
  const heroMeta = document.getElementById('heroMeta');
  metaParts.forEach(t => {
    const span = document.createElement('span');
    span.textContent = t;
    heroMeta.appendChild(span);
  });

  // Hero media
  const hero = document.getElementById('hero');
  let openVp = null;
  if (work.video) {
    const vid = document.createElement('video');
    vid.className = 'hero-media';
    vid.src = `works/video/${slug}/hero.mp4`;
    vid.poster = `works/video/${slug}/poster.jpg`;   // first frame, shows instantly while the video loads
    vid.autoplay = true;
    vid.muted = true;
    vid.loop = true;
    vid.playsInline = true;
    vid.setAttribute('playsinline', '');
    hero.prepend(vid);

    // thin loading bar along the bottom of the hero while the video downloads
    const loading = document.createElement('div');
    loading.className = 'hero-loading';
    loading.innerHTML = '<span></span>';
    hero.appendChild(loading);
    const loadFill = loading.firstChild;
    let loadTimer = null;
    const finishLoading = () => {
      clearInterval(loadTimer);
      loading.classList.remove('wait');
      loadFill.style.width = '100%';
      loading.classList.add('done');
    };
    const updateLoading = () => {
      const b = vid.buffered, d = vid.duration;
      if (!b.length || !d || !isFinite(d)) return;
      // furthest buffered point that covers the current playhead
      let end = 0;
      for (let k = 0; k < b.length; k++) if (b.start(k) <= vid.currentTime + .5) end = Math.max(end, b.end(k));
      loading.classList.remove('wait');
      const pct = Math.max(4, end / d * 100);
      loadFill.style.width = pct + '%';
      if (pct >= 99) finishLoading();
    };
    loading.classList.add('wait');
    vid.addEventListener('progress', updateLoading);
    vid.addEventListener('loadedmetadata', updateLoading);
    loadTimer = setInterval(updateLoading, 400);
    vid.addEventListener('canplaythrough', () => setTimeout(finishLoading, 300), { once: true });
    vid.addEventListener('error', () => { clearInterval(loadTimer); loading.remove(); }, { once: true });

    // "Watch video" button on every video work; the speaker icon only where there is a soundtrack
    hero.classList.add('hero--video');
    if (!work.sound) hero.classList.add('hero--silent');

    // player with sound: fullscreen overlay with sound + close
    const vp = document.getElementById('vp');
    const vpVideo = document.getElementById('vpVideo');
    const vpFill = document.getElementById('vpFill');
    const vpBuffered = document.getElementById('vpBuffered');
    const vpThumb = document.getElementById('vpThumb');
    const vpSeek = document.getElementById('vpSeek');
    const vpTime = document.getElementById('vpTime');
    const vpDur = document.getElementById('vpDur');
    const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
    vpVideo.src = vid.getAttribute('src');
    let vpReturnFocus = null;
    const heroSrc = vid.getAttribute('src');
    openVp = (src = heroSrc, hasSound = !!work.sound) => {
      if (vpVideo.getAttribute('src') !== src) { vpVideo.src = src; vpBuffered.style.width = '0'; vpDur.textContent = '0:00'; }
      vp.classList.toggle('vp--silent', !hasSound);
      vpReturnFocus = document.activeElement;
      setTimeout(() => document.getElementById('vpClose').focus({ preventScroll: true }), 50);
      vid.pause();
      vpVideo.currentTime = 0;
      vpVideo.muted = true;
      vp.classList.add('vp--muted');
      vp.classList.add('vp--open');
      vp.classList.remove('vp--paused', 'vp--idle');
      paint(0);
      document.documentElement.classList.add('lb-lock');
      document.body.style.overflow = 'hidden';
      vpVideo.play().catch(() => { vpVideo.muted = true; vp.classList.add('vp--muted'); vpVideo.play(); });
    };
    const closeVp = () => {
      if (vpReturnFocus && vpReturnFocus.focus) vpReturnFocus.focus({ preventScroll: true });
      vp.classList.remove('vp--open');
      document.documentElement.classList.remove('lb-lock');
      document.body.style.overflow = '';
      vpVideo.pause();
      clearTimeout(idleTimer);
      seeking = false;
      vp.classList.remove('vp--idle', 'vp--seeking');
      vid.play().catch(() => {});
    };
    document.getElementById('heroPlay').addEventListener('click', () => openVp());
    document.getElementById('vpClose').addEventListener('click', closeVp);
    document.getElementById('vpSound').addEventListener('click', () => {
      vpVideo.muted = !vpVideo.muted;
      vp.classList.toggle('vp--muted', vpVideo.muted);
      showControls();
    });
    // ── controls visibility: shown on open / tap / mouse move, hidden 1s later while playing.
    //    While paused or while the user is dragging the timeline they stay on screen.
    let idleTimer = null, seeking = false;
    const showControls = () => {
      vp.classList.remove('vp--idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!vpVideo.paused && !seeking) vp.classList.add('vp--idle');
      }, 1000);
    };
    const togglePlay = () => { vpVideo.paused ? vpVideo.play() : vpVideo.pause(); showControls(); };
    // tap on the picture: pause / resume + controls appear
    vpVideo.addEventListener('click', togglePlay);
    document.getElementById('vpPlay').addEventListener('click', togglePlay);
    vpVideo.addEventListener('pause', () => { vp.classList.add('vp--paused'); showControls(); });
    vpVideo.addEventListener('play', () => { vp.classList.remove('vp--paused'); showControls(); });
    vp.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') showControls(); });
    // any touch on the bars keeps them alive, so they never vanish under the finger
    vp.querySelectorAll('.vp-bar, .vp-controls').forEach(el => el.addEventListener('pointerdown', showControls));

    // ── time + progress
    const paint = t => {
      const d = vpVideo.duration || 0;
      const pct = d ? Math.min(100, t / d * 100) : 0;
      vpFill.style.width = pct + '%';
      vpThumb.style.left = pct + '%';
      vpTime.textContent = fmt(t);
      vpSeek.setAttribute('aria-valuenow', Math.round(pct));
    };
    vpVideo.addEventListener('loadedmetadata', () => { vpDur.textContent = fmt(vpVideo.duration); paint(vpVideo.currentTime); });
    vpVideo.addEventListener('timeupdate', () => { if (!seeking) paint(vpVideo.currentTime); });
    vpVideo.addEventListener('progress', () => {
      const b = vpVideo.buffered, d = vpVideo.duration;
      if (b.length && d) vpBuffered.style.width = (b.end(b.length - 1) / d * 100) + '%';
    });

    // ── scrubbing: tap or drag anywhere on the timeline
    const timeAt = x => {
      const r = vpSeek.getBoundingClientRect();
      return Math.min(1, Math.max(0, (x - r.left) / r.width)) * (vpVideo.duration || 0);
    };
    let wasPlaying = false;
    vpSeek.addEventListener('pointerdown', e => {
      if (!vpVideo.duration) return;
      e.preventDefault();
      seeking = true; wasPlaying = !vpVideo.paused;
      vp.classList.add('vp--seeking');
      vpSeek.setPointerCapture(e.pointerId);
      vpVideo.pause();
      const t = timeAt(e.clientX); paint(t); vpVideo.currentTime = t;
    });
    vpSeek.addEventListener('pointermove', e => {
      if (!seeking) return;
      const t = timeAt(e.clientX); paint(t); vpVideo.currentTime = t;
    });
    const endSeek = () => {
      if (!seeking) return;
      seeking = false;
      vp.classList.remove('vp--seeking');
      if (wasPlaying) vpVideo.play();
      showControls();
    };
    vpSeek.addEventListener('pointerup', endSeek);
    vpSeek.addEventListener('pointercancel', endSeek);
    vpSeek.addEventListener('lostpointercapture', endSeek);
    vpSeek.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        vpVideo.currentTime = Math.min(vpVideo.duration, Math.max(0, vpVideo.currentTime + (e.key === 'ArrowRight' ? 5 : -5)));
        showControls();
      }
    });
    document.addEventListener('keydown', e => {
      if (!vp.classList.contains('vp--open')) return;
      if (e.key === ' ' && document.activeElement !== vpSeek) { e.preventDefault(); togglePlay(); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && vp.classList.contains('vp--open')) closeVp(); });
  } else {
    const img = document.createElement('img');
    img.className = 'hero-img';
    img.src = `works/images/${slug}/01.jpg`;
    img.alt = work.title;
    hero.prepend(img);
  }

  // Gallery — one list of photos for the lightbox; on screen it can be split into parts
  // (versions / exhibitions), each with its own heading, text and photo row.
  const PARTS = work.parts || [{ folder: slug, count: work.count }];
  const PHOTOS = [];
  PARTS.forEach((part, pi) => {
    const nums = part.photos || Array.from({ length: part.count }, (_, k) => k + 1);
    nums.forEach(n => PHOTOS.push({ url: `works/images/${part.folder}/${String(n).padStart(2,'0')}.jpg`, part: pi }));
  });
  const TOTAL = PHOTOS.length;
  function imgUrl(n) { return PHOTOS[n - 1].url; }

  const grid = document.getElementById('galleryGrid');
  document.getElementById('galleryCount').textContent = `${TOTAL} images`;

  function makeItem(i, ratio) {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.style.flexGrow = ratio;          // widths ∝ ratio → equal heights in a row
    item.style.aspectRatio = ratio;
    item.style.setProperty('--r', ratio);
    const img = document.createElement('img');
    img.src = imgUrl(i);
    img.alt = `${work.title} — ${i}`;
    img.loading = 'lazy';
    item.appendChild(img);
    item.addEventListener('click', () => openLb(i - 1));
    item.tabIndex = 0;
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', `Open photo ${i} of ${TOTAL}`);
    item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i - 1); } });
    return item;
  }

  function makeVideoItem(ratio, base) {
    const item = document.createElement('div');
    item.className = 'gallery-item gallery-item--video';
    item.style.flexGrow = ratio;
    item.style.aspectRatio = ratio;
    item.style.setProperty('--r', ratio);
    const v = document.createElement('video');
    v.src = base + '.mp4';
    v.poster = base + '.jpg';
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    v.preload = 'metadata';
    item.appendChild(v);
    item.addEventListener('click', () => openVp && openVp(base + '.mp4', false));
    item.tabIndex = 0;
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', 'Watch video');
    item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openVp && openVp(base + '.mp4', false); } });
    // play silently while on screen
    new IntersectionObserver(e => { e[0].isIntersecting ? v.play().catch(() => {}) : v.pause(); }, { threshold: .25 }).observe(item);
    return item;
  }

  function imgRatio(i) {
    return new Promise(res => {
      const t = new Image();
      t.onload = () => res(t.naturalWidth / t.naturalHeight || 1.5);
      t.onerror = () => res(1.5);
      t.src = imgUrl(i);
    });
  }

  // Part heading: title, a meta line (year · medium · place), optional text
  function makePartHead(part) {
    const sec = document.createElement('section');
    sec.className = 'work-part';
    if (part.id) sec.id = part.id;
    if (part.title) {
      const h = document.createElement('h2');
      h.className = 'work-part-title';
      h.textContent = part.title;
      sec.appendChild(h);
    }
    if (part.meta) {
      const m = document.createElement('p');
      m.className = 'work-part-meta';
      part.meta.forEach(t => { const sp = document.createElement('span'); sp.textContent = t; m.appendChild(sp); });
      sec.appendChild(m);
    }
    const t = part.text && TEXTS[part.text];
    if (t) {
      const box = document.createElement('div');
      box.className = 'work-text';
      t.text.forEach(x => { const pp = document.createElement('p'); pp.textContent = tidy(x); box.appendChild(pp); });
      sec.appendChild(box);
    }
    return sec;
  }

  // Layout: alternate full / pair; a pair is only made from two photos of the same orientation.
  function layoutRow(entries, gridEl) {
    const portrait = r => r < 1;
    let i = 0, lastWasPair = true;
    while (i < entries.length) {
      const row = document.createElement('div');
      row.className = 'gallery-row';
      const bothClips = entries[i].clip && entries[i + 1] && entries[i + 1].clip;
      const canPair = i + 1 < entries.length && (!lastWasPair || bothClips) &&
                      portrait(entries[i].ratio) === portrait(entries[i + 1].ratio);
      const n = canPair ? 2 : 1;
      for (let k = 0; k < n; k++) row.appendChild(entries[i + k].make());
      gridEl.appendChild(row);
      lastWasPair = canPair;
      // a lone portrait would be huge at full width — cap its size
      if (n === 1 && portrait(entries[i].ratio)) row.classList.add('gallery-row--solo-portrait');
      i += n;
    }
  }

  const clipBase = n => `works/video/${slug}/clip-${n}`;
  const clipCount = work.clips || 0;
  const clipRatio = n => new Promise(res => {
    const t = new Image();
    t.onload = () => res(t.naturalWidth / t.naturalHeight || .75);
    t.onerror = () => res(.75);
    t.src = clipBase(n) + '.jpg';
  });
  Promise.all([
    Promise.all(Array.from({ length: clipCount }, (_, k) => clipRatio(k + 1))),
    Promise.all(PHOTOS.map((_, k) => imgRatio(k + 1))),
  ]).then(([clipRatios, photoRatios]) => {
    let anchor = grid;
    PARTS.forEach((part, pi) => {
      const entries = [];
      if (pi === 0) clipRatios.forEach((ratio, k) => entries.push({ ratio, clip: true, make: () => makeVideoItem(ratio, clipBase(k + 1)) }));
      PHOTOS.forEach((ph, k) => { if (ph.part === pi) entries.push({ ratio: photoRatios[k], make: () => makeItem(k + 1, photoRatios[k]) }); });
      let gridEl = grid;
      if (work.parts) {
        const head = makePartHead(part);
        if (pi > 0) {
          head.classList.add('work-part--next');
          gridEl = document.createElement('div');
          gridEl.className = 'gallery-grid';
          anchor.after(head); head.after(gridEl);
        } else {
          grid.before(head);
        }
      }
      layoutRow(entries, gridEl);
      anchor = gridEl;
    });
    if (jumpToPart) {
      const target = document.getElementById(jumpToPart);
      if (target) requestAnimationFrame(() => window.scrollTo({ top: target.getBoundingClientRect().top + scrollY - 72 }));
    }
  });

  // Lightbox
  const lbEl      = document.getElementById('lb');
  const lbStage   = lbEl.querySelector('.lb-stage');
  const lbImg     = document.getElementById('lbImg');
  const lbTitle   = document.getElementById('lbTitle');
  const lbCounter = document.getElementById('lbCounter');
  const lbClose   = document.getElementById('lbClose');
  const lbPrev    = document.getElementById('lbPrev');
  const lbNext    = document.getElementById('lbNext');
  const lbNwEl    = document.getElementById('lbNw');
  const lbEnd     = document.getElementById('lbEnd');
  let lbIdx = 0;

  // phones get an extra "next work" slide after the last photo
  const isPhone = () => window.matchMedia('(max-width: 768px)').matches;
  const lastIdx = () => isPhone() ? TOTAL : TOTAL - 1;
  const nextHref = `work.html?s=${nextSlug}`;
  document.getElementById('lbEndTitle').textContent = nextWork.title;
  document.getElementById('lbEndImg').src = `works/images/${nextSlug}/01.jpg`;
  document.getElementById('lbEndImg').alt = nextWork.title;
  document.getElementById('lbEndCover').href = nextHref;
  document.getElementById('lbEndBtn').href = nextHref;


  let lbReturnFocus = null;
  function openLb(idx) {
    lbReturnFocus = document.activeElement;
    lbIdx = idx; showLb();
    setTimeout(() => lbClose.focus({ preventScroll: true }), 50);
    lbEl.classList.add('lb--open');
    document.documentElement.classList.add('lb-lock');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    if (lbReturnFocus && lbReturnFocus.focus) lbReturnFocus.focus({ preventScroll: true });
    lbEl.classList.remove('lb--open');
    document.documentElement.classList.remove('lb-lock');
    document.body.style.overflow = '';
    lbImg.classList.remove('lb-img--in');
  }
  function showLb() {
    const onEnd = lbIdx === TOTAL;            // phone end slide
    lbEnd.hidden = !onEnd;
    lbImg.hidden = onEnd;
    lbCounter.style.visibility = onEnd ? 'hidden' : '';
    lbPrev.hidden = lbIdx === 0;
    if (onEnd) { lbNext.hidden = true; lbNwEl.hidden = true; return; }
    lbCounter.textContent = `${lbIdx + 1} / ${TOTAL}`;
    const isLast = lbIdx === lastIdx();
    lbNext.hidden = isLast;
    lbNwEl.hidden = !isLast;
    lbImg.classList.remove('lb-img--in');
    const url = imgUrl(lbIdx + 1);
    const tmp = new Image();
    tmp.onload = () => { lbImg.src = url; requestAnimationFrame(() => lbImg.classList.add('lb-img--in')); };
    tmp.src = url;
  }
  function navigate(d) { const n = lbIdx + d; if (n >= 0 && n <= lastIdx()) { lbIdx = n; showLb(); } }

  lbClose.addEventListener('click', closeLb);
  lbPrev.addEventListener('click', () => navigate(-1));
  lbNext.addEventListener('click', () => navigate(1));
  lbStage.addEventListener('click', e => {
    if (e.target === lbImg || e.target.closest('.lb-end')) return;
    if (e.target.closest && e.target.closest('.lb-btn')) return;
    closeLb();
  });
  document.addEventListener('keydown', e => {
    if (!lbEl.classList.contains('lb--open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowRight') {
      if (lbIdx === lastIdx()) location.href = nextHref;  // end → next work
      else navigate(1);
    }
    if (e.key === 'ArrowLeft') navigate(-1);
  });
  let tx = null;
  lbEl.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
  lbEl.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) {
      navigate(dx < 0 ? 1 : -1);  // on phones the last swipe opens the "next work" slide
    }
    tx = null;
  });

  // Nav: white on hero, switch to ink when scrolled past hero
  const navEl = document.querySelector('.nav');
  const heroContent = document.querySelector('.hero-content');
  const syncNav = () => {
    const limit = heroContent.getBoundingClientRect().top + window.scrollY - navEl.offsetHeight - 12;
    navEl.classList.toggle('nav--scrolled', window.scrollY > limit);
  };
  window.addEventListener('scroll', syncNav, { passive: true });
  window.addEventListener('resize', syncNav);
  syncNav();

  // Floating next-work pill — only after the hero, hidden again when the big next-work block is visible
  const pill = document.getElementById('nextPill');
  const nextSection = document.querySelector('.next-work');
  let pastHero = false, footerVisible = false;
  const isPhoneW = () => window.matchMedia('(max-width: 768px)').matches;
  const syncPill = () => pill.classList.toggle('hidden', (isPhoneW() && !pastHero) || footerVisible);
  new IntersectionObserver(e => { pastHero = !e[0].isIntersecting; syncPill(); }, { threshold: 0.35 })
    .observe(document.getElementById('hero'));
  new IntersectionObserver(e => { footerVisible = e[0].isIntersecting; syncPill(); }, { threshold: 0.1 })
    .observe(nextSection);

  // back to top
  const toTop = document.getElementById('toTop');
  const syncTop = () => toTop.classList.toggle('show', window.scrollY > innerHeight * .8);
  window.addEventListener('scroll', syncTop, { passive: true });

  // scroll-down hint
  const scrollHint = document.getElementById('scrollHint');
  scrollHint.addEventListener('click', () => window.scrollTo({ top: document.querySelector('.gallery-section').offsetTop - (document.querySelector('.nav').offsetHeight || 0), behavior: 'smooth' }));
  window.addEventListener('scroll', () => scrollHint.classList.toggle('gone', scrollY > 40), { passive: true });
  syncTop();
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
</script>
</body>
</html>
